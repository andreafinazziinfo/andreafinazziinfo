<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Warm Charcoal Theme) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12110f" />
      <stop offset="50%" stop-color="#181714" />
      <stop offset="100%" stop-color="#12110f" />
    </linearGradient>

    <!-- Glowing Accents (Gold and Muted Slate Teal) -->
    <linearGradient id="gold-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1a759" />
      <stop offset="100%" stop-color="#b98b38" />
    </linearGradient>

    <linearGradient id="teal-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69a7ad" />
      <stop offset="100%" stop-color="#0f666b" />
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1a759" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#69a7ad" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#12110f" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Effects Filters -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Premium Grid Pattern (Satoshi style layout grid) -->
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#2c2822" stroke-width="0.6" stroke-opacity="0.75" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    /* Satoshi & Bespoke Serif Typography Replication */
    .title-name {
      font-family: 'Bespoke Serif', 'Georgia', serif;
      font-weight: 700;
      fill: #ece3d8;
      letter-spacing: -1px;
    }
    .subtitle-spec {
      font-family: 'Satoshi', 'Inter', sans-serif;
      font-weight: 900;
      fill: #d1a759;
      letter-spacing: 2px;
      font-size: 11px;
      text-transform: uppercase;
    }
    .terminal-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10.5px;
      fill: #b5ab9f;
    }
    .terminal-header {
      font-family: 'Satoshi', sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      fill: #837a6f;
      letter-spacing: 1px;
    }
    
    .gold-txt { fill: #d1a759; }
    .teal-txt { fill: #69a7ad; }
    .muted-txt { fill: #837a6f; }
    .bright-txt { fill: #ece3d8; }

    /* Animated status dot */
    @keyframes pulse-gold {
      0%, 100% { fill: #d1a759; filter: drop-shadow(0 0 2px #d1a759); }
      50% { fill: #b98b38; filter: drop-shadow(0 0 0px #d1a759); }
    }
    .status-dot-gold {
      animation: pulse-gold 2.5s infinite;
    }

    /* Blinking terminal cursor */
    @keyframes cursor-blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    .term-cursor {
      animation: cursor-blink 1.2s step-end infinite;
      fill: #69a7ad;
    }

    /* Core Flow Line animation */
    @keyframes flow-line {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    .dynamic-line {
      stroke-dasharray: 8 12;
      animation: flow-line 25s linear infinite;
    }
    ]]>
  </style>

  <!-- Container Base (Warm Editorial Border) -->
  <rect width="848" height="278" x="1" y="1" rx="10" fill="url(#bg-grad)" stroke="#39352f" stroke-width="1.5" />

  <!-- Grid Overlay -->
  <rect width="848" height="278" x="1" y="1" rx="10" fill="url(#grid)" />

  <!-- Decorative Quant Wave (Core loop pathway) -->
  <path d="M -50 170 Q 150 110, 320 180 T 680 160 T 950 180" 
        fill="none" stroke="url(#core-glow)" stroke-width="38" opacity="0.35" />
  
  <path d="M -50 170 Q 150 110, 320 180 T 680 160 T 950 180" 
        fill="none" stroke="#d1a759" stroke-width="1.5" opacity="0.25" stroke-dasharray="5 5" />
        
  <path class="dynamic-line" d="M -50 170 Q 150 110, 320 180 T 680 160 T 950 180" 
        fill="none" stroke="url(#teal-neon)" stroke-width="1.5" opacity="0.8" />

  <!-- LEFT SIDE: Glassmorphic Ecosytem Terminal (Flywheel Visualizer) -->
  <g transform="translate(35, 45)">
    <!-- Main Window Frame -->
    <rect width="370" height="190" rx="8" fill="#181714" fill-opacity="0.9" stroke="#39352f" stroke-width="1.2" />
    
    <!-- Title Bar -->
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.75" />
    <circle cx="34" cy="18" r="4.5" fill="#eab308" opacity="0.75" />
    <circle cx="48" cy="18" r="4.5" fill="#22c55e" opacity="0.75" />
    <text x="75" y="21" class="terminal-header">CORE_ENGINE://FLYWHEEL_CONTROL</text>
    <path d="M 0 32 L 370 32" stroke="#39352f" stroke-width="1" />

    <!-- Terminal Output -->
    <g transform="translate(18, 38)">
      <text x="0" y="20" class="terminal-text"><tspan class="gold-txt">andrea@engine</tspan>:<tspan class="teal-txt">~/flywheel</tspan>$ ./init_core.sh</text>
      
      <text x="0" y="42" class="terminal-text">[<tspan class="teal-txt">INIT</tspan>] Bootstrapping three-engine pipeline...</text>
      <text x="0" y="62" class="terminal-text">  -> <tspan class="bright-txt">TITAN</tspan>: Research Ingestion [Active Regime]</text>
      <text x="0" y="82" class="terminal-text">  -> <tspan class="bright-txt">CONTROL PLANE</tspan>: AI Orchestration [Connected]</text>
      <text x="0" y="102" class="terminal-text">  -> <tspan class="bright-txt">CYCLE LAB</tspan>: Quant Platform [Monetization Ready]</text>
      
      <text x="0" y="122" class="terminal-text">[<tspan class="gold-txt">SYS</tspan>] Operational status: <tspan class="teal-txt">Optimal Loop</tspan> (Leva 95% Private)</text>
      
      <!-- Prompt Line -->
      <text x="0" y="142" class="terminal-text"><tspan class="gold-txt">andrea@engine</tspan>:<tspan class="teal-txt">~/flywheel</tspan>$ <tspan class="bright-txt">sys_status --active</tspan><tspan class="term-cursor">█</tspan></text>
    </g>
  </g>

  <!-- RIGHT SIDE: Editorial Presentation -->
  <g transform="translate(445, 52)">
    <!-- Active Status HUD Badge -->
    <g transform="translate(230, 0)">
      <rect width="135" height="24" rx="12" fill="#1e1c19" stroke="#39352f" stroke-width="1" />
      <circle cx="16" cy="12" r="4.5" class="status-dot-gold" />
      <text x="28" y="16" font-family="'Satoshi', sans-serif" font-size="9.5" fill="#ece3d8" font-weight="900" letter-spacing="1">SYSTEM ACTIVE</text>
    </g>

    <!-- Main Editorial Headline -->
    <text x="0" y="52" class="title-name" font-size="34" filter="url(#glow-teal)">Andrea Finazzi</text>
    <text x="0" y="80" class="subtitle-spec">QUANTITATIVE SYSTEMS &amp; EXECUTION ARCHITECT</text>
    
    <!-- Flywheel Motifs Description -->
    <g transform="translate(0, 112)" font-family="'Satoshi', sans-serif" font-size="12" fill="#b5ab9f">
      <!-- Motor 1 -->
      <text x="0" y="15" font-weight="700" fill="#ece3d8">01 / TITAN</text>
      <text x="90" y="15">Knowledge Engine &amp; Quantitative Research</text>
      
      <!-- Motor 2 -->
      <text x="0" y="40" font-weight="700" fill="#ece3d8">02 / CONTROL PLANE</text>
      <text x="90" y="40">Autonomous AI Orchestration &amp; Memory Layer</text>

      <!-- Motor 3 -->
      <text x="0" y="65" font-weight="700" fill="#ece3d8">03 / CYCLE LAB</text>
      <text x="90" y="65">SaaS Product, Trading Systems &amp; Monetization</text>
    </g>
    
    <!-- Editorial Motto -->
    <text x="0" y="202" font-family="'Bespoke Serif', serif" font-size="11.5" fill="#837a6f" font-style="italic">
      Research &amp; Knowledge Ingestion → Automated AI Execution → Product Monetization
    </text>
  </g>

</svg>
