<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0c1020" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="teal-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09F1B8" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Wave/Cycle Gradient -->
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#09F1B8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#09F1B8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Effect Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    /* CSS Styles and Animations */
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: 5px;
    }
    .subtitle {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      fill: #09F1B8;
      letter-spacing: 2px;
      font-size: 13px;
    }
    .terminal-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      fill: #94a3b8;
    }
    .terminal-header {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      font-weight: bold;
      fill: #475569;
    }
    .cyan-text { fill: #09F1B8; }
    .purple-text { fill: #8B5CF6; }
    .white-text { fill: #e2e8f0; }
    .amber-text { fill: #f59e0b; }
    .green-text { fill: #10b981; }

    /* Wave animation */
    @keyframes draw-wave {
      0% { stroke-dashoffset: 2000; }
      100% { stroke-dashoffset: 0; }
    }
    .animated-wave {
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      animation: draw-wave 6s linear infinite;
    }

    /* Terminal blinking cursor */
    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    .cursor {
      animation: blink 1s step-end infinite;
      fill: #09F1B8;
    }

    /* Status dot pulsing */
    @keyframes pulse {
      0% { fill: #09F1B8; filter: drop-shadow(0 0 2px #09F1B8); }
      50% { fill: #059669; filter: drop-shadow(0 0 0px #09F1B8); }
      100% { fill: #09F1B8; filter: drop-shadow(0 0 2px #09F1B8); }
    }
    .status-dot {
      animation: pulse 2s infinite;
    }

    /* Subtle grid animation */
    @keyframes grid-drift {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }
    .drifting-grid {
      /* Keep standard static grid to avoid high CPU usage but look premium */
    }
    ]]>
  </style>

  <!-- Container Base -->
  <rect width="848" height="278" x="1" y="1" rx="12" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Cyber Grid Overlay -->
  <rect width="848" height="278" x="1" y="1" rx="12" fill="url(#grid)" />

  <!-- Decorative Mathematical Waves (Quantitative aesthetics) -->
  <path d="M -50 180 C 100 120, 200 240, 350 170 C 500 100, 600 220, 750 160 C 850 120, 900 180, 950 180" 
        fill="none" stroke="url(#wave-grad)" stroke-width="3" filter="url(#glow-soft)" />
        
  <path class="animated-wave" d="M -50 180 C 100 120, 200 240, 350 170 C 500 100, 600 220, 750 160 C 850 120, 900 180, 950 180" 
        fill="none" stroke="#09F1B8" stroke-width="1.5" opacity="0.8" />

  <path d="M -50 195 C 90 145, 180 250, 330 190 C 480 130, 580 230, 720 180 C 820 145, 880 195, 950 195" 
        fill="none" stroke="#8B5CF6" stroke-width="1" opacity="0.3" stroke-dasharray="4 4" />

  <!-- Live Terminal Mockup (Left Side) -->
  <g transform="translate(35, 45)">
    <!-- Terminal Box -->
    <rect width="360" height="190" rx="8" fill="#04060d" fill-opacity="0.85" stroke="#1e293b" stroke-width="1" />
    
    <!-- Title bar dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#eab308" />
    <circle cx="52" cy="18" r="5" fill="#22c55e" />
    <text x="80" y="21" class="terminal-header">CORE_INTERFACE://LOC_WORKSPACE</text>

    <!-- Terminal Lines -->
    <g transform="translate(15, 35)">
      <text x="0" y="20" class="terminal-text"><tspan class="purple-text">info@finazzi</tspan>:<tspan class="cyan-text">~/platform</tspan>$ ./matassa --detect-cycles</text>
      <text x="0" y="40" class="terminal-text">[<tspan class="green-text">OK</tspan>] Core cyclical engine: <tspan class="white-text">Matassa v3.4</tspan></text>
      <text x="0" y="60" class="terminal-text">[<tspan class="green-text">OK</tspan>] HMM State Regime: <tspan class="amber-text">Harmonic Cycle Extension</tspan></text>
      <text x="0" y="80" class="terminal-text">[<tspan class="cyan-text">INF</tspan>] Docker container status: <tspan class="green-text">5 running</tspan></text>
      <text x="0" y="100" class="terminal-text">[<tspan class="purple-text">SYS</tspan>] Local vector db: <tspan class="white-text">pgvector isolated (127.0.0.1)</tspan></text>
      <text x="0" y="120" class="terminal-text">[<tspan class="green-text">OK</tspan>] DX HUD statusline loaded successfully.</text>
      
      <!-- Blinking Shell Line -->
      <text x="0" y="140" class="terminal-text"><tspan class="purple-text">info@finazzi</tspan>:<tspan class="cyan-text">~/platform</tspan>$ <tspan class="white-text">sys_state --check</tspan><tspan class="cursor">█</tspan></text>
    </g>
  </g>

  <!-- Profile Identity & Details (Right Side) -->
  <g transform="translate(435, 45)">
    <!-- Status Indicator Badge -->
    <g transform="translate(230, 0)">
      <rect width="130" height="24" rx="12" fill="#0c1622" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="12" r="4.5" class="status-dot" />
      <text x="28" y="16" font-family="'Fira Code', 'Courier New', monospace" font-size="9" fill="#94a3b8" font-weight="bold">SYSTEMS ACTIVE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="55" class="title" font-size="32" filter="url(#glow)">ANDREA FINAZZI</text>
    <text x="0" y="85" class="subtitle">QUANTITATIVE ARCHITECT &amp; SYSTEMS BUILDER</text>
    
    <!-- Bullet Points of Core Capabilities (Styled and Aligned) -->
    <g transform="translate(0, 115)" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">
      <!-- Bullet 1 -->
      <text x="0" y="15" font-weight="bold" fill="#e2e8f0">📈 Quantitative Systems</text>
      <text x="20" y="32">Proprietary cyclical market regime tools (TradingView/Pine)</text>
      
      <!-- Bullet 2 -->
      <text x="0" y="55" font-weight="bold" fill="#e2e8f0">🐳 Local-First Architecture</text>
      <text x="20" y="72">Docker containerization, SQLite vectors, private-first focus</text>
    </g>

    <!-- Design Motto -->
    <text x="0" y="212" font-family="'Fira Code', 'Courier New', monospace" font-size="11" fill="#475569" font-style="italic">
      // Functional engineering, exceptional presentations.
    </text>
  </g>

</svg>
