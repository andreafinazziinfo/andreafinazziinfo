<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Terminal Glass Gradient -->
    <linearGradient id="term-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1224" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>

    <!-- Glow Accents -->
    <linearGradient id="teal-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09F1B8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    .title-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 1px;
    }
    .desc-text {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      fill: #94a3b8;
    }
    .mono-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      font-weight: bold;
      fill: #ffffff;
    }

    /* Animated status pulsing */
    @keyframes pulse {
      0%, 100% { fill: #10b981; filter: drop-shadow(0 0 1px #10b981); }
      50% { fill: #059669; filter: drop-shadow(0 0 5px #10b981); }
    }
    .live-dot {
      animation: pulse 1.8s infinite;
    }

    /* Terminal blinking cursor */
    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    .cursor {
      animation: blink 1s step-end infinite;
      fill: #09F1B8;
    }

    /* Waveform movement inside mock HUD */
    @keyframes hud-flow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -30; }
    }
    .hud-line {
      stroke-dasharray: 6 4;
      animation: hud-flow 2s linear infinite;
    }
    ]]>
  </style>

  <!-- Background Base -->
  <rect width="848" height="198" x="1" y="1" rx="10" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1" />
  <rect width="848" height="198" x="1" y="1" rx="10" fill="url(#grid)" />

  <!-- Glassmorphic Terminal Card (Left) -->
  <g transform="translate(30, 24)">
    <!-- Terminal Outer Frame -->
    <rect width="400" height="150" rx="8" fill="url(#term-grad)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Title bar dots -->
    <circle cx="16" cy="16" r="4" fill="#ef4444" opacity="0.75" />
    <circle cx="28" cy="16" r="4" fill="#eab308" opacity="0.75" />
    <circle cx="40" cy="16" r="4" fill="#22c55e" opacity="0.75" />
    <text x="60" y="19" font-family="'Fira Code', 'Courier New', monospace" font-size="9" fill="#475569" font-weight="bold">HUD_OUTPUT // ACTIVE_SESSION</text>
    
    <!-- HUD Graphical Representation inside terminal -->
    <g transform="translate(15, 35)">
      <!-- Line 1: Shell prompt -->
      <text x="0" y="15" class="mono-text" fill="#475569">> claude-flow --hud-status</text>
      
      <!-- Styled HUD Panel Mockup (What his tool does) -->
      <rect x="0" y="30" width="370" height="75" rx="6" fill="#04060b" stroke="#1e293b" stroke-width="1" />
      
      <!-- Internal HUD components -->
      <!-- Token metrics -->
      <text x="15" y="52" class="mono-text" fill="#8B5CF6" font-weight="bold">TOKENS</text>
      <text x="75" y="52" class="mono-text" fill="#cbd5e1">24.5k / 120.0k</text>
      <rect x="185" y="44" width="100" height="8" rx="4" fill="#1e1b4b" />
      <rect x="185" y="44" width="35" height="8" rx="4" fill="#8B5CF6" filter="url(#glow)" />
      
      <!-- Session cost -->
      <text x="15" y="72" class="mono-text" fill="#09F1B8" font-weight="bold">COSTS</text>
      <text x="75" y="72" class="mono-text" fill="#cbd5e1">$0.187 session</text>
      
      <!-- HUD graphic waves -->
      <path class="hud-line" d="M 185 68 L 285 68" stroke="#09F1B8" stroke-width="2" fill="none" opacity="0.8" />
      
      <!-- Git Info -->
      <rect x="295" y="45" width="60" height="30" rx="4" fill="#0e1a17" stroke="#09f1b8" stroke-opacity="0.3" stroke-width="1" />
      <text x="325" y="58" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="9" fill="#09F1B8" font-weight="bold">GIT:main</text>
      <text x="325" y="70" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="8" fill="#475569">FRESH:OK</text>
      
      <!-- Shell cursor -->
      <text x="0" y="130" class="mono-text" fill="#475569">> <tspan fill="#09F1B8">_</tspan><tspan class="cursor">█</tspan></text>
    </g>
  </g>

  <!-- Project Details & Features (Right) -->
  <g transform="translate(460, 24)">
    <!-- Title -->
    <text x="0" y="25" class="title-text" fill="#ffffff" filter="url(#glow)">⚡ claude-statusline-pro</text>
    
    <!-- Tagline description -->
    <text x="0" y="52" class="desc-text">Terminal HUD status bar for Claude Code that displays</text>
    <text x="0" y="70" class="desc-text">real-time tokens, session costs, Git branch, and tool freshness</text>
    <text x="0" y="88" class="desc-text">directly inside your shell environment.</text>
    
    <!-- Custom SVG Badges (aligned horizontally - strictly gold-free) -->
    <g transform="translate(0, 115)">
      <!-- Badge 1: Status: Active -->
      <g transform="translate(0, 0)">
        <rect width="105" height="22" rx="4" fill="#0b1716" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
        <circle class="live-dot" cx="14" cy="11" r="3.5" fill="#10b981" />
        <text x="26" y="15" class="badge-text" fill="#10b981">Active HUD</text>
      </g>

      <!-- Badge 2: License: MIT (Now Purged of Gold/Amber) -->
      <g transform="translate(115, 0)">
        <rect width="85" height="22" rx="4" fill="#0b1424" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1" />
        <text x="12" y="15" class="badge-text" fill="#0ea5e9">⚖️ MIT</text>
      </g>

      <!-- Badge 3: Language: Bash -->
      <g transform="translate(210, 0)">
        <rect width="115" height="22" rx="4" fill="#100b21" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1" />
        <text x="12" y="15" class="badge-text" fill="#8B5CF6">📁 Bash 4+ / CLI</text>
      </g>
    </g>
  </g>
</svg>
