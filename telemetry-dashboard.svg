<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1122" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="local-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="public-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#09F1B8" />
    </linearGradient>

    <!-- Glossy node gradients -->
    <linearGradient id="node-peak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09F1B8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="node-high" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="node-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    .hud-header {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      font-weight: bold;
      fill: #475569;
    }
    .hud-title {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1px;
      fill: #ffffff;
    }
    .hud-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      fill: #cbd5e1;
    }
    .hud-subtext {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11px;
      fill: #64748b;
    }

    /* Subtle telemetry pulse animations */
    @keyframes bar-shine {
      0% { opacity: 0.8; }
      50% { opacity: 1; filter: brightness(1.15); }
      100% { opacity: 0.8; }
    }
    .animated-bar {
      animation: bar-shine 3s infinite ease-in-out;
    }

    @keyframes pulse-node {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: brightness(1.2) drop-shadow(0 0 3px #09F1B8); }
    }
    .pulsing-node-peak {
      animation: pulse-node 2.5s infinite ease-in-out;
    }
    ]]>
  </style>

  <!-- Background Base -->
  <rect width="848" height="238" x="1" y="1" rx="10" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1" />
  <rect width="848" height="238" x="1" y="1" rx="10" fill="url(#grid)" />

  <!-- Terminal Style Mockup Window -->
  <g transform="translate(25, 20)">
    <!-- Terminal Body -->
    <rect width="798" height="198" rx="8" fill="#04060c" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Title bar dots -->
    <circle cx="18" cy="16" r="4.5" fill="#ef4444" />
    <circle cx="32" cy="16" r="4.5" fill="#eab308" />
    <circle cx="46" cy="16" r="4.5" fill="#22c55e" />
    <text x="68" y="19" class="hud-header">OPERATIONAL_LOGS // REALTIME_CADENCE</text>
    <path d="M 0 30 L 798 30" stroke="#1e293b" stroke-width="1" />

    <!-- LEFT PANEL: Cadence Spans -->
    <g transform="translate(25, 45)">
      <text x="0" y="15" class="hud-title">Operational Distribution</text>
      
      <!-- Local Workspace Bar -->
      <g transform="translate(0, 32)">
        <text x="0" y="10" class="hud-text" fill="#a855f7">Local Workspace</text>
        <text x="320" y="10" class="hud-text" fill="#ffffff" font-weight="bold">95%</text>
        
        <rect x="0" y="18" width="340" height="12" rx="6" fill="#1e1b4b" />
        <rect class="animated-bar" x="0" y="18" width="323" height="12" rx="6" fill="url(#local-bar)" filter="url(#glow-purple)" />
        <text x="0" y="42" class="hud-subtext">Private core indicators &amp; structural backtesting execution.</text>
      </g>

      <!-- Public Gateways Bar -->
      <g transform="translate(0, 97)">
        <text x="0" y="10" class="hud-text" fill="#09F1B8">Public Gateways</text>
        <text x="320" y="10" class="hud-text" fill="#ffffff" font-weight="bold">5%</text>
        
        <rect x="0" y="18" width="340" height="12" rx="6" fill="#082f27" />
        <rect class="animated-bar" x="0" y="18" width="17" height="12" rx="6" fill="url(#public-bar)" filter="url(#glow-teal)" />
        <text x="0" y="42" class="hud-subtext">Selective developer utility gateways &amp; command statusbars.</text>
      </g>
    </g>

    <!-- VERTICAL DIVIDER -->
    <path d="M 425 40 L 425 180" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- RIGHT PANEL: Activity Conceptual Flow Mockup -->
    <g transform="translate(455, 45)">
      <text x="0" y="15" class="hud-title">System Activity Flow (Conceptual Mapping)</text>
      
      <!-- Weekday Rows -->
      <!-- Mon Row -->
      <g transform="translate(0, 35)">
        <text x="0" y="14" class="hud-text" fill="#64748b">Mon</text>
        <!-- Nodes grid -->
        <rect x="40" y="2" width="14" height="14" rx="3" fill="#1e293b" />
        <rect x="60" y="2" width="14" height="14" rx="3" fill="#1e293b" />
        <rect x="80" y="2" width="14" height="14" rx="3" fill="url(#node-mid)" />
        <rect x="100" y="2" width="14" height="14" rx="3" fill="url(#node-high)" />
        <rect x="120" y="2" width="14" height="14" rx="3" fill="url(#node-mid)" />
        <rect x="140" y="2" width="14" height="14" rx="3" fill="#1e293b" />
        <rect x="160" y="2" width="14" height="14" rx="3" fill="#1e293b" />
        
        <text x="195" y="13" class="hud-subtext" fill="#94a3b8">Base Monitoring &amp; Ops</text>
      </g>

      <!-- Wed Row -->
      <g transform="translate(0, 68)">
        <text x="0" y="14" class="hud-text" fill="#64748b">Wed</text>
        <!-- Nodes grid -->
        <rect x="40" y="2" width="14" height="14" rx="3" fill="#1e293b" />
        <rect x="60" y="2" width="14" height="14" rx="3" fill="#1e293b" />
        <rect x="80" y="2" width="14" height="14" rx="3" fill="url(#node-mid)" />
        <rect x="100" y="2" width="14" height="14" rx="3" fill="url(#node-high)" />
        <rect class="pulsing-node-peak" x="120" y="2" width="14" height="14" rx="3" fill="url(#node-peak)" filter="url(#glow-teal)" />
        <rect x="140" y="2" width="14" height="14" rx="3" fill="url(#node-mid)" />
        <rect x="160" y="2" width="14" height="14" rx="3" fill="#1e293b" />
        
        <text x="195" y="13" class="hud-subtext" fill="#94a3b8">Core Engine &amp; Backtesting</text>
      </g>

      <!-- Fri Row -->
      <g transform="translate(0, 101)">
        <text x="0" y="14" class="hud-text" fill="#64748b">Fri</text>
        <!-- Nodes grid -->
        <rect x="40" y="2" width="14" height="14" rx="3" fill="#1e293b" />
        <rect x="60" y="2" width="14" height="14" rx="3" fill="#1e293b" />
        <rect x="80" y="2" width="14" height="14" rx="3" fill="#1e293b" />
        <rect x="100" y="2" width="14" height="14" rx="3" fill="url(#node-mid)" />
        <rect x="120" y="2" width="14" height="14" rx="3" fill="url(#node-high)" />
        <rect x="140" y="2" width="14" height="14" rx="3" fill="#1e293b" />
        <rect x="160" y="2" width="14" height="14" rx="3" fill="#1e293b" />
        
        <text x="195" y="13" class="hud-subtext" fill="#94a3b8">Quantitative Deployments</text>
      </g>
    </g>
  </g>
</svg>
