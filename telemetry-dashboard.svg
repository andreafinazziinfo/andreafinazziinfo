<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12110f" />
      <stop offset="50%" stop-color="#181714" />
      <stop offset="100%" stop-color="#12110f" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="local-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b98b38" />
      <stop offset="100%" stop-color="#d1a759" />
    </linearGradient>

    <linearGradient id="public-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f666b" />
      <stop offset="100%" stop-color="#69a7ad" />
    </linearGradient>

    <!-- Node Hues -->
    <linearGradient id="node-peak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d1a759" />
      <stop offset="100%" stop-color="#b98b38" />
    </linearGradient>
    <linearGradient id="node-high" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#69a7ad" />
      <stop offset="100%" stop-color="#327c82" />
    </linearGradient>
    <linearGradient id="node-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c2822" />
      <stop offset="100%" stop-color="#211d18" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Satoshi Layout Grid -->
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#2c2822" stroke-width="0.6" stroke-opacity="0.75" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    .hud-header {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 10px;
      font-weight: bold;
      fill: #837a6f;
    }
    .hud-title {
      font-family: 'Satoshi', sans-serif;
      font-weight: 900;
      font-size: 13.5px;
      letter-spacing: 1px;
      fill: #ece3d8;
    }
    .hud-text {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      fill: #b5ab9f;
    }
    .hud-subtext {
      font-family: 'Satoshi', sans-serif;
      font-size: 11px;
      fill: #837a6f;
    }

    @keyframes pulse-node-gold {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; filter: brightness(1.2) drop-shadow(0 0 2px #d1a759); }
    }
    .pulsing-peak {
      animation: pulse-node-gold 2.5s infinite ease-in-out;
    }
    ]]>
  </style>

  <!-- Background Base -->
  <rect width="848" height="238" x="1" y="1" rx="10" fill="url(#bg-grad)" stroke="#39352f" stroke-width="1.5" />
  <rect width="848" height="238" x="1" y="1" rx="10" fill="url(#grid)" />

  <!-- Terminal Style Mockup Window -->
  <g transform="translate(25, 20)">
    <!-- Terminal Body -->
    <rect width="798" height="198" rx="8" fill="#181714" fill-opacity="0.95" stroke="#39352f" stroke-width="1.2" />
    
    <!-- Title bar dots -->
    <circle cx="18" cy="16" r="4.5" fill="#ef4444" opacity="0.75" />
    <circle cx="32" cy="16" r="4.5" fill="#eab308" opacity="0.75" />
    <circle cx="46" cy="16" r="4.5" fill="#22c55e" opacity="0.75" />
    <text x="68" y="19" class="hud-header">OPERATIONAL_TELEMETRY // REGIME_CADENCE</text>
    <path d="M 0 30 L 798 30" stroke="#39352f" stroke-width="1" />

    <!-- LEFT PANEL: Cadence Spans -->
    <g transform="translate(25, 45)">
      <text x="0" y="15" class="hud-title">Operational Distribution</text>
      
      <!-- Local Workspace Bar -->
      <g transform="translate(0, 32)">
        <text x="0" y="10" class="hud-text" fill="#d1a759">Local Workspace</text>
        <text x="320" y="10" class="hud-text" fill="#ece3d8" font-weight="bold">95%</text>
        
        <rect x="0" y="18" width="340" height="12" rx="6" fill="#2c2822" />
        <rect x="0" y="18" width="323" height="12" rx="6" fill="url(#local-bar)" />
        <text x="0" y="42" class="hud-subtext">Private quant cycle core engines &amp; Titan research data.</text>
      </g>

      <!-- Public Gateways Bar -->
      <g transform="translate(0, 97)">
        <text x="0" y="10" class="hud-text" fill="#69a7ad">Public Gateways</text>
        <text x="320" y="10" class="hud-text" fill="#ece3d8" font-weight="bold">5%</text>
        
        <rect x="0" y="18" width="340" height="12" rx="6" fill="#2c2822" />
        <rect x="0" y="18" width="17" height="12" rx="6" fill="url(#public-bar)" />
        <text x="0" y="42" class="hud-subtext">Open-source command statuslines, wrappers &amp; HUD portals.</text>
      </g>
    </g>

    <!-- VERTICAL DIVIDER -->
    <path d="M 425 40 L 425 180" stroke="#39352f" stroke-width="1" stroke-dasharray="3 3" />

    <!-- RIGHT PANEL: Activity Conceptual Flow Grid -->
    <g transform="translate(455, 45)">
      <text x="0" y="15" class="hud-title">System Activity Flow (Conceptual Mapping)</text>
      
      <!-- Weekday Rows -->
      <!-- Mon Row -->
      <g transform="translate(0, 35)">
        <text x="0" y="14" class="hud-text" fill="#837a6f">Mon</text>
        <!-- Nodes grid -->
        <rect x="40" y="2" width="14" height="14" rx="3" fill="#2c2822" />
        <rect x="60" y="2" width="14" height="14" rx="3" fill="#2c2822" />
        <rect x="80" y="2" width="14" height="14" rx="3" fill="url(#node-mid)" />
        <rect x="100" y="2" width="14" height="14" rx="3" fill="url(#node-high)" />
        <rect x="120" y="2" width="14" height="14" rx="3" fill="url(#node-mid)" />
        <rect x="140" y="2" width="14" height="14" rx="3" fill="#2c2822" />
        <rect x="160" y="2" width="14" height="14" rx="3" fill="#2c2822" />
        
        <text x="195" y="13" class="hud-subtext" fill="#b5ab9f">Base Monitoring &amp; Ops</text>
      </g>

      <!-- Wed Row -->
      <g transform="translate(0, 68)">
        <text x="0" y="14" class="hud-text" fill="#837a6f">Wed</text>
        <!-- Nodes grid -->
        <rect x="40" y="2" width="14" height="14" rx="3" fill="#2c2822" />
        <rect x="60" y="2" width="14" height="14" rx="3" fill="#2c2822" />
        <rect x="80" y="2" width="14" height="14" rx="3" fill="url(#node-mid)" />
        <rect x="100" y="2" width="14" height="14" rx="3" fill="url(#node-high)" />
        <rect class="pulsing-peak" x="120" y="2" width="14" height="14" rx="3" fill="url(#node-peak)" filter="url(#glow-gold)" />
        <rect x="140" y="2" width="14" height="14" rx="3" fill="url(#node-mid)" />
        <rect x="160" y="2" width="14" height="14" rx="3" fill="#2c2822" />
        
        <text x="195" y="13" class="hud-subtext" fill="#b5ab9f">Core Engine &amp; Backtesting</text>
      </g>

      <!-- Fri Row -->
      <g transform="translate(0, 101)">
        <text x="0" y="14" class="hud-text" fill="#837a6f">Fri</text>
        <!-- Nodes grid -->
        <rect x="40" y="2" width="14" height="14" rx="3" fill="#2c2822" />
        <rect x="60" y="2" width="14" height="14" rx="3" fill="#2c2822" />
        <rect x="80" y="2" width="14" height="14" rx="3" fill="#2c2822" />
        <rect x="100" y="2" width="14" height="14" rx="3" fill="url(#node-mid)" />
        <rect x="120" y="2" width="14" height="14" rx="3" fill="url(#node-high)" />
        <rect x="140" y="2" width="14" height="14" rx="3" fill="#2c2822" />
        <rect x="160" y="2" width="14" height="14" rx="3" fill="#2c2822" />
        
        <text x="195" y="13" class="hud-subtext" fill="#b5ab9f">Quantitative Deployments</text>
      </g>
    </g>
  </g>
</svg>
