<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0c1020" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1428" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#050812" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="teal-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09F1B8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <linearGradient id="purple-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    .card-title {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .card-list {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 11.5px;
      fill: #cbd5e1;
    }
    .card-bullet {
      fill: #475569;
    }
    ]]>
  </style>

  <!-- Background Base -->
  <rect width="848" height="218" x="1" y="1" rx="10" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1" />
  <rect width="848" height="218" x="1" y="1" rx="10" fill="url(#grid)" />

  <!-- CARD 1: QUANTITATIVE SYSTEMS -->
  <g transform="translate(25, 20)">
    <!-- Card Frame -->
    <rect width="250" height="180" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Neon Top Border Accent -->
    <path d="M 8 0 L 242 0" stroke="url(#teal-neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-teal)" />
    
    <!-- Card Icon & Header -->
    <g transform="translate(15, 25)">
      <!-- Rising Graph Icon -->
      <path d="M 0 15 L 6 9 L 12 13 L 22 3" stroke="#09F1B8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-teal)" />
      <polygon points="17,3 22,3 22,8" fill="#09F1B8" />
      
      <text x="32" y="12" class="card-title" fill="#09F1B8">QUANTITATIVE SYSTEMS</text>
    </g>

    <!-- Card Description Lines -->
    <g transform="translate(15, 60)" class="card-list">
      <!-- Bullet 1 -->
      <circle cx="5" cy="5" r="2.5" class="card-bullet" fill="#09F1B8" />
      <text x="18" y="9">Proprietary cyclical indicators</text>
      <text x="18" y="24" fill="#94a3b8" font-size="10.5">TradingView / Pine Script</text>
      
      <!-- Bullet 2 -->
      <circle cx="5" cy="45" r="2.5" class="card-bullet" />
      <text x="18" y="49">Structural regime detectors</text>
      <text x="18" y="64" fill="#94a3b8" font-size="10.5">Automated cycle backtesters</text>
      
      <!-- Bullet 3 -->
      <circle cx="5" cy="85" r="2.5" class="card-bullet" />
      <text x="18" y="89">Low-latency data analysis</text>
      <text x="18" y="104" fill="#94a3b8" font-size="10.5">Quant-driven risk frameworks</text>
    </g>
  </g>

  <!-- CARD 2: KNOWLEDGE ENGINEERING -->
  <g transform="translate(300, 20)">
    <!-- Card Frame -->
    <rect width="250" height="180" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Neon Top Border Accent -->
    <path d="M 8 0 L 242 0" stroke="url(#purple-neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-purple)" />
    
    <!-- Card Icon & Header -->
    <g transform="translate(15, 25)">
      <!-- Network Nodes Icon -->
      <circle cx="5" cy="12" r="3" fill="#8B5CF6" filter="url(#glow-purple)" />
      <circle cx="18" cy="4" r="3" fill="#ec4899" />
      <circle cx="18" cy="18" r="3" fill="#8B5CF6" />
      <line x1="5" y1="12" x2="18" y2="4" stroke="#8B5CF6" stroke-width="1.5" />
      <line x1="5" y1="12" x2="18" y2="18" stroke="#8B5CF6" stroke-width="1.5" />
      
      <text x="32" y="12" class="card-title" fill="#8B5CF6">KNOWLEDGE SYSTEMS</text>
    </g>

    <!-- Card Description Lines -->
    <g transform="translate(15, 60)" class="card-list">
      <!-- Bullet 1 -->
      <circle cx="5" cy="5" r="2.5" class="card-bullet" fill="#8B5CF6" />
      <text x="18" y="9">Local pgvector &amp; SQLite search</text>
      <text x="18" y="24" fill="#94a3b8" font-size="10.5">Isolated vector research indexes</text>
      
      <!-- Bullet 2 -->
      <circle cx="5" cy="45" r="2.5" class="card-bullet" />
      <text x="18" y="49">Context routing architectures</text>
      <text x="18" y="64" fill="#94a3b8" font-size="10.5">Highly token-efficient pipelines</text>
      
      <!-- Bullet 3 -->
      <circle cx="5" cy="85" r="2.5" class="card-bullet" />
      <text x="18" y="89">Isolated LLM integrations</text>
      <text x="18" y="104" fill="#94a3b8" font-size="10.5">Private knowledge harvesting</text>
    </g>
  </g>

  <!-- CARD 3: INFRASTRUCTURE & DX -->
  <g transform="translate(575, 20)">
    <!-- Card Frame -->
    <rect width="250" height="180" rx="8" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Neon Top Border Accent -->
    <path d="M 8 0 L 242 0" stroke="url(#teal-neon)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-teal)" />
    
    <!-- Card Icon & Header -->
    <g transform="translate(15, 25)">
      <!-- Terminal/Docker Layer Icon -->
      <rect x="0" y="3" width="18" height="13" rx="2" fill="none" stroke="#09F1B8" stroke-width="2" filter="url(#glow-teal)" />
      <path d="M 4 9 L 7 11 L 4 13 M 9 13 L 13 13" stroke="#09F1B8" stroke-width="1.5" fill="none" />
      
      <text x="32" y="12" class="card-title" fill="#09F1B8">INFRASTRUCTURE &amp; DX</text>
    </g>

    <!-- Card Description Lines -->
    <g transform="translate(15, 60)" class="card-list">
      <!-- Bullet 1 -->
      <circle cx="5" cy="5" r="2.5" class="card-bullet" fill="#09F1B8" />
      <text x="18" y="9">Docker-first isolation</text>
      <text x="18" y="24" fill="#94a3b8" font-size="10.5">Absolute local container safety</text>
      
      <!-- Bullet 2 -->
      <circle cx="5" cy="45" r="2.5" class="card-bullet" />
      <text x="18" y="49">Terminal HUD statuslines</text>
      <text x="18" y="64" fill="#94a3b8" font-size="10.5">Real-time session monitoring</text>
      
      <!-- Bullet 3 -->
      <circle cx="5" cy="85" r="2.5" class="card-bullet" />
      <text x="18" y="89">Custom shell wrappers</text>
      <text x="18" y="104" fill="#94a3b8" font-size="10.5">Command line pipeline accelerators</text>
    </g>
  </g>
</svg>
