<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12110f" />
      <stop offset="50%" stop-color="#181714" />
      <stop offset="100%" stop-color="#12110f" />
    </linearGradient>

    <!-- Node Card Gradients -->
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1a17" />
      <stop offset="100%" stop-color="#141310" />
    </linearGradient>

    <!-- Glowing Accents -->
    <linearGradient id="gold-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1a759" />
      <stop offset="100%" stop-color="#b98b38" />
    </linearGradient>
    
    <linearGradient id="teal-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69a7ad" />
      <stop offset="100%" stop-color="#0f666b" />
    </linearGradient>

    <linearGradient id="flow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1a759" />
      <stop offset="50%" stop-color="#69a7ad" />
      <stop offset="100%" stop-color="#d1a759" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Satoshi Layout Grid -->
    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="#2c2822" stroke-width="0.6" stroke-opacity="0.75" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    .text-title {
      font-family: 'Satoshi', sans-serif;
      font-weight: 900;
      font-size: 13.5px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .text-body {
      font-family: 'Satoshi', sans-serif;
      font-size: 11px;
      fill: #b5ab9f;
    }
    .text-num {
      font-family: 'Bespoke Serif', serif;
      font-weight: 700;
      font-size: 20px;
      fill: #d1a759;
    }
    .text-label {
      font-family: 'Satoshi', sans-serif;
      font-weight: 700;
      font-size: 9.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      fill: #837a6f;
    }

    /* Laser stream animations along pathways */
    @keyframes flow-stream {
      to { stroke-dashoffset: -40; }
    }
    .stream-line {
      stroke-dasharray: 8 12;
      animation: flow-stream 1.5s linear infinite;
    }
    
    @keyframes pulse-card {
      0%, 100% { border-color: #39352f; box-shadow: none; }
      50% { border-color: #d1a759; }
    }
    .pulsing-card {
      /* Subtle border highlights */
    }
    ]]>
  </style>

  <!-- Background Base -->
  <rect width="848" height="238" x="1" y="1" rx="10" fill="url(#bg-grad)" stroke="#39352f" stroke-width="1.5" />
  <rect width="848" height="238" x="1" y="1" rx="10" fill="url(#grid)" />

  <!-- ENGINE 1: TITAN -->
  <g transform="translate(30, 45)">
    <!-- Frame -->
    <rect width="210" height="120" rx="6" fill="url(#node-grad)" stroke="#39352f" stroke-width="1.2" />
    <path d="M 6 0 L 204 0" stroke="url(#gold-neon)" stroke-width="1.5" stroke-linecap="round" />
    
    <text x="180" y="26" class="text-num">01</text>
    <text x="18" y="30" class="text-title" fill="#d1a759">TITAN</text>
    <text x="18" y="55" class="text-body" fill="#ece3d8" font-weight="700">Knowledge Engine</text>
    
    <text x="18" y="78" class="text-body">• Ingests papers &amp; research</text>
    <text x="18" y="93" class="text-body">• Signals &amp; pattern analysis</text>
  </g>

  <!-- ENGINE 2: CONTROL PLANE -->
  <g transform="translate(320, 45)">
    <!-- Frame -->
    <rect width="210" height="120" rx="6" fill="url(#node-grad)" stroke="#39352f" stroke-width="1.2" />
    <path d="M 6 0 L 204 0" stroke="url(#teal-neon)" stroke-width="1.5" stroke-linecap="round" />
    
    <text x="180" y="26" class="text-num" fill="#69a7ad">02</text>
    <text x="18" y="30" class="text-title" fill="#69a7ad">CONTROL PLANE</text>
    <text x="18" y="55" class="text-body" fill="#ece3d8" font-weight="700">AI Operating System</text>
    
    <text x="18" y="78" class="text-body">• Governs AI execution</text>
    <text x="18" y="93" class="text-body">• Context routing &amp; memory</text>
  </g>

  <!-- ENGINE 3: CYCLE LAB -->
  <g transform="translate(610, 45)">
    <!-- Frame -->
    <rect width="210" height="120" rx="6" fill="url(#node-grad)" stroke="#39352f" stroke-width="1.2" />
    <path d="M 6 0 L 204 0" stroke="url(#gold-neon)" stroke-width="1.5" stroke-linecap="round" />
    
    <text x="180" y="26" class="text-num">03</text>
    <text x="18" y="30" class="text-title" fill="#d1a759">CYCLE LAB</text>
    <text x="18" y="55" class="text-body" fill="#ece3d8" font-weight="700">Quant SaaS &amp; Bots</text>
    
    <text x="18" y="78" class="text-body">• Backtesting &amp; analytics</text>
    <text x="18" y="93" class="text-body">• Signal monetization</text>
  </g>

  <!-- FORWARD FLOW LINES -->
  <!-- Stream 1: Titan -> Control Plane -->
  <g transform="translate(240, 105)">
    <path d="M 0 0 L 80 0" stroke="#39352f" stroke-width="3" stroke-linecap="round" />
    <path class="stream-line" d="M 0 0 L 80 0" stroke="url(#gold-neon)" stroke-width="1.5" stroke-linecap="round" />
    <text x="40" y="-8" text-anchor="middle" class="text-label" font-size="8">RESEARCH</text>
  </g>

  <!-- Stream 2: Control Plane -> Cycle Lab -->
  <g transform="translate(530, 105)">
    <path d="M 0 0 L 80 0" stroke="#39352f" stroke-width="3" stroke-linecap="round" />
    <path class="stream-line" d="M 0 0 L 80 0" stroke="url(#teal-neon)" stroke-width="1.5" stroke-linecap="round" />
    <text x="40" y="-8" text-anchor="middle" class="text-label" font-size="8">EXECUTION</text>
  </g>

  <!-- FLYWHEEL FEEDBACK RETURN LOOP (UNDERNEATH) -->
  <g>
    <!-- Base Curved Line -->
    <path d="M 715 165 C 715 220, 135 220, 135 165" fill="none" stroke="#39352f" stroke-width="3" />
    
    <!-- Animated return line -->
    <path class="stream-line" d="M 715 165 C 715 220, 135 220, 135 165" fill="none" stroke="url(#flow-grad)" stroke-width="1.5" />
    
    <!-- Central Label Badge -->
    <rect x="290" y="195" width="270" height="20" rx="10" fill="#181714" stroke="#39352f" stroke-width="1.2" />
    <text x="425" y="209" text-anchor="middle" font-family="'Satoshi', sans-serif" font-size="9" font-weight="900" fill="#d1a759" letter-spacing="1.5">🔄 RE-INVESTS IN QUANTITATIVE RESEARCH</text>
  </g>
</svg>
