<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1122" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="prop-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#090514" stop-opacity="0.8" />
    </linearGradient>
    
    <linearGradient id="pub-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062f29" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#021412" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="purple-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <linearGradient id="teal-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#09F1B8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>

    <linearGradient id="stream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#09F1B8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    <![CDATA[
    .text-title {
      font-family: system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 1.5px;
    }
    .text-body {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #cbd5e1;
    }
    .text-tag {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      font-weight: bold;
    }
    
    /* Animation for the data flow */
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 2px #8B5CF6); opacity: 0.6; }
      50% { filter: drop-shadow(0 0 8px #8B5CF6); opacity: 1; }
    }
    .pulsing-border-left {
      animation: pulse-glow 3s infinite;
    }

    @keyframes pulse-glow-teal {
      0%, 100% { filter: drop-shadow(0 0 2px #09F1B8); opacity: 0.6; }
      50% { filter: drop-shadow(0 0 8px #09F1B8); opacity: 1; }
    }
    .pulsing-border-right {
      animation: pulse-glow-teal 3s infinite 1.5s;
    }

    @keyframes flow-dash {
      to {
        stroke-dashoffset: -40;
      }
    }
    .animated-stream {
      stroke-dasharray: 8 12;
      animation: flow-dash 1.5s linear infinite;
    }

    @keyframes pulse-dot {
      0% { r: 3; opacity: 0.5; }
      50% { r: 6; opacity: 1; filter: drop-shadow(0 0 4px #09F1B8); }
      100% { r: 3; opacity: 0.5; }
    }
    .pulsing-dot {
      animation: pulse-dot 2s infinite;
    }
    ]]>
  </style>

  <!-- Background Base -->
  <rect width="848" height="238" x="1" y="1" rx="10" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1" />
  <rect width="848" height="238" x="1" y="1" rx="10" fill="url(#grid)" />

  <!-- LEFT BOX: PROPRIETARY (🔒) -->
  <g transform="translate(40, 30)">
    <!-- Main Box -->
    <rect width="320" height="180" rx="8" fill="url(#prop-grad)" stroke="#1e293b" stroke-width="1.5" />
    <!-- Pulsing Glow Border Overlay -->
    <rect class="pulsing-border-left" width="320" height="180" rx="8" fill="none" stroke="url(#purple-neon)" stroke-width="1.5" />
    
    <!-- Title Section -->
    <rect width="320" height="35" rx="8" fill="#140f2d" fill-opacity="0.8" />
    <path d="M 0 35 L 320 35" stroke="#1e293b" stroke-width="1" />
    <text x="160" y="22" text-anchor="middle" fill="#D946EF" class="text-title">🔒 PROPRIETARY SYSTEMS</text>
    
    <!-- Bullet points -->
    <g transform="translate(25, 65)">
      <!-- Line 1 -->
      <circle cx="5" cy="-4" r="3" fill="#8B5CF6" />
      <text x="20" y="0" class="text-body">Cycle Analysis Indicators</text>
      
      <!-- Line 2 -->
      <circle cx="5" cy="26" r="3" fill="#8B5CF6" />
      <text x="20" y="30" class="text-body">Backtesting &amp; Regime Engines</text>
      
      <!-- Line 3 -->
      <circle cx="5" cy="56" r="3" fill="#8B5CF6" />
      <text x="20" y="60" class="text-body">Local Vector Knowledge Bases</text>
    </g>

    <!-- Decorative status element -->
    <rect x="235" y="145" width="70" height="20" rx="4" fill="#0f0920" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1" />
    <text x="270" y="158" text-anchor="middle" fill="#8B5CF6" class="text-tag">SECURE</text>
  </g>

  <!-- DATA FLOW STREAM CONNECTOR (CENTER) -->
  <g transform="translate(360, 0)">
    <!-- Background connection line -->
    <path d="M 0 120 L 128 120" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    
    <!-- Glowing flow stream -->
    <path d="M 0 120 Q 64 100, 128 120" fill="none" stroke="url(#stream-grad)" stroke-width="3" filter="url(#glow-soft)" />
    <path class="animated-stream" d="M 0 120 Q 64 100, 128 120" fill="none" stroke="#09F1B8" stroke-width="2" stroke-linecap="round" />

    <!-- Pulse nodes -->
    <circle cx="64" cy="110" r="4.5" fill="#09F1B8" class="pulsing-dot" />
    <text x="64" y="90" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="10" fill="#94a3b8" font-weight="bold">PIPELINE</text>
  </g>

  <!-- RIGHT BOX: PUBLIC UTILITIES (🔌) -->
  <g transform="translate(488, 30)">
    <!-- Main Box -->
    <rect width="320" height="180" rx="8" fill="url(#pub-grad)" stroke="#1e293b" stroke-width="1.5" />
    <!-- Pulsing Glow Border Overlay -->
    <rect class="pulsing-border-right" width="320" height="180" rx="8" fill="none" stroke="url(#teal-neon)" stroke-width="1.5" />
    
    <!-- Title Section -->
    <rect width="320" height="35" rx="8" fill="#041a18" fill-opacity="0.8" />
    <path d="M 0 35 L 320 35" stroke="#1e293b" stroke-width="1" />
    <text x="160" y="22" text-anchor="middle" fill="#09F1B8" class="text-title">🔌 PUBLIC UTILITIES</text>
    
    <!-- Bullet points -->
    <g transform="translate(25, 65)">
      <!-- Line 1 -->
      <circle cx="5" cy="-4" r="3" fill="#09F1B8" />
      <text x="20" y="0" class="text-body">claude-statusline-pro</text>
      
      <!-- Line 2 -->
      <circle cx="5" cy="26" r="3" fill="#09F1B8" />
      <text x="20" y="30" class="text-body">CLI Wrapper Filters</text>
      
      <!-- Line 3 -->
      <circle cx="5" cy="56" r="3" fill="#09F1B8" />
      <text x="20" y="60" class="text-body">Shell Automation Scripts</text>
    </g>

    <!-- Decorative status element -->
    <rect x="235" y="145" width="70" height="20" rx="4" fill="#011614" stroke="#09f1b8" stroke-opacity="0.3" stroke-width="1" />
    <text x="270" y="158" text-anchor="middle" fill="#09F1B8" class="text-tag">DISTRIB</text>
  </g>
</svg>
