      <g transform="translate(118,0)"><rect width="88" height="30" rx="8" fill="#161b22" stroke="#30363d"/><circle cx="18" cy="15" r="7" fill="#DEA584"/><text x="32" y="19" class="chip-text">Rust</text></g>
